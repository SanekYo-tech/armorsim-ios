name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  unity-export:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: port/Library
          key: Library-iOS-${{ hashFiles('port/Assets/**', 'port/Packages/**', 'port/ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-

      - name: Export Unity Xcode project
        id: unity
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        with:
          projectPath: port
          unityVersion: 6000.3.11f1
          targetPlatform: iOS
          buildMethod: ArmorSimBuild.BuildiOS
          buildsPath: build
          cacheUnityInstallationOnMac: true
          customParameters: "-armorsimOutputPath ${{ github.workspace }}/build/Xcode -armorsimBundleId ${{ secrets.IOS_BUNDLE_ID || 'com.galimovdynamics.armorsim' }}"

      - name: Install signing certificate and profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_CERTIFICATE_BASE64:-}" ] || [ -z "${IOS_PROVISION_PROFILE_BASE64:-}" ]; then
            echo "Signing secrets are not configured: the workflow will produce an UNSIGNED .ipa."
            echo "SIGNED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SIGNED=1" >> "$GITHUB_ENV"
          CERT=$RUNNER_TEMP/armorsim.p12
          PROFILE=$RUNNER_TEMP/armorsim.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/armorsim.keychain-db
          python3 -c 'import base64,sys;open(sys.argv[1],"wb").write(base64.b64decode(sys.stdin.read()))' "$CERT" <<< "$IOS_CERTIFICATE_BASE64"
          python3 -c 'import base64,sys;open(sys.argv[1],"wb").write(base64.b64decode(sys.stdin.read()))' "$PROFILE" <<< "$IOS_PROVISION_PROFILE_BASE64"
          security create-keychain -p armorsim "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p armorsim "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k armorsim "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print:UUID' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/profile_uuid"
          echo "PROFILE_UUID=$(cat "$RUNNER_TEMP/profile_uuid")" >> "$GITHUB_ENV"

      - name: Archive and export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID || 'com.galimovdynamics.armorsim' }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          XCODEWS=$(find "$GITHUB_WORKSPACE/build/Xcode" -maxdepth 2 -name '*.xcworkspace' ! -path '*.xcodeproj/*' -print -quit)
          XCODEPROJ=$(find "$GITHUB_WORKSPACE/build/Xcode" -maxdepth 2 -name '*.xcodeproj' -print -quit)
          if [ -n "$XCODEWS" ]; then
            XCODE_ARGS=(-workspace "$XCODEWS")
          elif [ -n "$XCODEPROJ" ]; then
            XCODE_ARGS=(-project "$XCODEPROJ")
          else
            echo "No Xcode workspace or project found under build/Xcode" >&2
            exit 1
          fi
          rm -rf "$GITHUB_WORKSPACE/build/ipa" "$RUNNER_TEMP/ArmorSim.xcarchive"
          mkdir -p "$GITHUB_WORKSPACE/build/ipa"
          COMMON=("${XCODE_ARGS[@]}" -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ArmorSim.xcarchive")
          if [ "${SIGNED:-0}" = "1" ]; then
            METHOD=${IOS_EXPORT_METHOD:-ad-hoc}
            case "$METHOD" in
              development) SIGN_IDENTITY="Apple Development" ;;
              *)            SIGN_IDENTITY="Apple Distribution" ;;
            esac
            cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>destination</key><string>export</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
          </dict></plist>
          EOF
            xcodebuild archive "${COMMON[@]}" \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/ArmorSim.xcarchive" \
              -exportPath "$GITHUB_WORKSPACE/build/ipa" \
              -exportOptionsPlist "$RUNNER_TEMP/export.plist"
          else
            echo "Building UNSIGNED .ipa (sign it locally with Sideloadly/AltStore)."
            xcodebuild archive "${COMMON[@]}" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER=""
            APP=$(find "$RUNNER_TEMP/ArmorSim.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
            test -n "$APP"
            mkdir -p "$GITHUB_WORKSPACE/build/ipa/Payload"
            cp -R "$APP" "$GITHUB_WORKSPACE/build/ipa/Payload/"
            (cd "$GITHUB_WORKSPACE/build/ipa" && zip -qry ArmorSim-unsigned.ipa Payload)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ArmorSim-iOS
          path: build/ipa/*.ipa
          if-no-files-found: error
