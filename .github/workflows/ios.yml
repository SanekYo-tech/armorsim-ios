name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  unity-export:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Export Unity Xcode project
        id: unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          ARMORSIM_XCODE_PATH: ${{ github.workspace }}/build/Xcode
        with:
          projectPath: port
          unityVersion: 6000.3.11f1
          targetPlatform: iOS
          buildMethod: ArmorSimBuild.BuildiOS
          buildsPath: build

      - name: Install signing certificate and profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT=$RUNNER_TEMP/armorsim.p12
          PROFILE=$RUNNER_TEMP/armorsim.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/armorsim.keychain-db
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security create-keychain -p armorsim "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p armorsim "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k armorsim "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print:UUID' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/profile_uuid"
          echo "PROFILE_UUID=$(cat "$RUNNER_TEMP/profile_uuid")" >> "$GITHUB_ENV"

      - name: Archive and export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          XCODEPROJ=$(find "$GITHUB_WORKSPACE/build/Xcode" -maxdepth 2 -name '*.xcodeproj' -print -quit)
          test -n "$XCODEPROJ"
          METHOD=${IOS_EXPORT_METHOD:-ad-hoc}
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$METHOD</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>$IOS_BUNDLE_ID</key><string>$PROFILE_UUID</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild archive \
            -project "$XCODEPROJ" -scheme Unity-iPhone -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ArmorSim.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ArmorSim.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: ArmorSim-iOS
          path: build/ipa/*.ipa
          if-no-files-found: error
