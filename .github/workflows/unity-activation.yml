name: Unity activation file

# Run this once to obtain the manual activation file (.alf).
# 1. Actions -> "Unity activation file" -> Run workflow
# 2. Download the Unity_v6000.3.11f1.alf artifact
# 3. Open https://license.unity3d.com/manual, upload the .alf, choose the license
#    type (Personal), download the .ulf file
# 4. Add repository secret UNITY_LICENSE = the full text of the .ulf file
#
# For Unity Pro/Plus you can skip this and add UNITY_SERIAL instead.

on:
  workflow_dispatch:

jobs:
  request-activation-file:
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: getManualLicenseFile
        with:
          unityVersion: 6000.3.11f1

      - uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}